<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#10272b" />
    <meta name="application-name" content="CuaDB" />
    <meta name="csrf-token" content="{{ csrf }}" />
    <meta name="htmx-config" content='{"historyCacheSize":0,"allowEval":false,"includeIndicatorStyles":false}' />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/app.css" />
    <link rel="manifest" href="/static/site.webmanifest" />
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/icon-192.png" />
    <script src="/static/theme.js"></script>
    <script defer src="/static/htmx.min.js"></script>
    <script defer src="/static/app.js"></script>
  </head>
  <body>
    {% block content %}{% endblock %}
    <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
