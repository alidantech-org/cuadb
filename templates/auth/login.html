{% extends "base.html" %}
{% block content %}
<div id="login" class="show">
  <form class="lc" method="post" action="/login" autocomplete="off">
    <h2 id="login-title">Sign in to CuaDB</h2>
    <p>Use the account provided for you.</p>
    <label class="fl"><span>Username</span><input class="inp" name="login" maxlength="64" required autocomplete="username" autofocus></label>
    <label class="fl"><span>Password</span><input class="inp" name="password" type="password" maxlength="256" required autocomplete="current-password"></label>
    <div class="err2 lerr" role="alert">{{ message }}</div>
    <button class="btn on" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
