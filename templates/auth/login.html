<form id="login" method="post" action="/login" autocomplete="off">
  <h1>Sign in</h1>
  {% if !message.is_empty() %}<p role="alert">{{ message }}</p>{% endif %}
  <label>Login <input name="login" maxlength="64" required autocomplete="username"></label>
  <label>Password <input name="password" type="password" maxlength="256" required autocomplete="current-password"></label>
  <button type="submit">Sign in</button>
</form>
