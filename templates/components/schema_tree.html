<div class="schema-tree" aria-label="Database schemas" role="tree">
  {% if schemas.is_empty() %}
    <div class="note" role="status">{{ note }}</div>
  {% else %}
    {% for schema in schemas %}
    <div class="sch" role="treeitem" aria-expanded="false" data-schema-name="{{ schema.name }}">
      <button class="sh fo" type="button" data-s aria-label="Schema {{ schema.name }}" hx-get="{{ schema.href }}" hx-trigger="click once" hx-target="next .sub" hx-swap="innerHTML"><i class="ic-slot" data-ic="folder" aria-hidden="true"></i><span>{{ schema.name }}</span></button>
      <div class="sub" role="group"><div class="note">Loading relations…</div></div>
    </div>
    {% endfor %}
  {% endif %}
</div>
