<span class="sr-only">Relations in {{ schema }}</span>
{% if relations.is_empty() %}
  <div class="note" role="status">{{ note }}</div>
{% else %}
  {% for relation in relations %}
  <a href="{{ relation.href }}" class="row" data-relation-name="{{ relation.name }}" data-kind="{{ relation.kind }}" hx-get="{{ relation.href }}" hx-target="#mainbody" hx-swap="innerHTML" hx-sync="#mainbody:replace" title="{{ relation.kind }}" aria-label="Open {{ relation.kind }} {{ relation.name }}"><i class="ic-slot" data-ic="relation" data-name="{{ relation.name }}" data-kind="{{ relation.kind }}" aria-hidden="true"></i><span class="n">{{ relation.name }}</span>{% if relation.kind != "Table" %}<span class="c">{{ relation.kind }}</span>{% endif %}</a>
  {% endfor %}
  {% if truncated %}<div class="note" role="status">{{ note }}</div>{% endif %}
{% endif %}
<div class="objs" data-objs="{{ objects_href }}"></div>
