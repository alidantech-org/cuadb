{% if profiles.is_empty() %}
<div class="note" role="status">No connection is configured on the server.</div>
{% else %}
{% for profile in profiles %}
<button class="ci" type="button" role="option" data-profile="{{ profile.id }}" aria-selected="{% if profile.selected %}true{% else %}false{% endif %}" data-label="{{ profile.label }}" data-ready="{{ profile.ready }}"
  hx-get="/catalog/schemas?profile={{ profile.id }}" hx-target="#tree" hx-swap="innerHTML" hx-trigger="click"><span><b>{{ profile.label }}</b><small>{{ profile.engine }} · {{ profile.state }}</small></span>{% if profile.selected %}<span class="chk">✓</span>{% endif %}</button>
{% endfor %}
{% endif %}
