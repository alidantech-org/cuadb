{% extends "base.html" %}
{% block content %}
<div class="app-shell">
  <aside id="side" aria-label="Database explorer">
    <div class="sf">
      <input class="inp" id="f" placeholder="Search tables…" autocomplete="off" aria-label="Search tables">
      <span class="kbd">Ctrl K</span>
    </div>
    <div id="tree" aria-label="Schemas and relations" hx-sync="#tree:replace">
      <div hx-get="/catalog/schemas" hx-trigger="load" hx-target="#tree" hx-swap="innerHTML"
        hx-indicator="#tree-loading">Loading accessible schemas…</div>
    </div>
    <div class="sfoot">
      <span class="conn-label">Configured connection</span>
      <span id="connection-indicator" role="status" aria-live="polite"
        hx-get="/connection/status" hx-trigger="load" hx-swap="outerHTML">Checking…</span>
      <button class="gear" type="button" aria-label="Settings" title="Settings">⚙</button>
    </div>
  </aside>
  <div id="rs" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize sidebar" aria-valuemin="180" aria-valuemax="520" aria-valuenow="264" title="Drag to resize; double-click to reset"></div>
  <main>
    <div id="mainbody" hx-sync="#mainbody:replace" hx-indicator="#mainbody">
      <section class="empty-state" aria-live="polite">
        <h1>CuaDB</h1>
        <p>Choose an accessible schema or relation to inspect read-only database information.</p>
        <p id="tree-loading" class="htmx-indicator">Loading catalog…</p>
      </section>
      <section id="catalog-panel" aria-label="Selected database content" aria-live="polite"
        hx-history="false"></section>
    </div>
  </main>
</div>
<button class="btn ico hm" id="menu" data-toggle-sidebar aria-controls="side" aria-expanded="false"
  aria-label="Toggle sidebar">☰</button>
<div id="toast" role="status" aria-live="polite"></div>
{% endblock %}
