[package]
name = "cuadb"
version = "0.1.0"
edition = "2024"
description = "A lightweight, read-only database explorer"
license = "MIT"
publish = false

[dependencies]
askama = "0.16.1"
async-trait = "0.1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
# Pin the engine driver while the adapter contract is being established.
# No SQL migrations, macro compiler database access, or extra engines.
sqlx = { version = "=0.8.6", default-features = false, features = ["mysql", "postgres", "sqlite", "runtime-tokio", "tls-rustls-ring-webpki"] }
url = "=2.5.8"
getrandom = "0.3"
zip = { version = "=2.6.1", default-features = false }
argon2 = "0.5"
sha2 = "0.10"
sqlparser = { version = "0.59", features = ["visitor"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Password hashing is deliberately expensive; keep debug builds and tests usable.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
