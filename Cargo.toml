[package]
name = "cuadb"
version = "0.1.0"
edition = "2024"
description = "A lightweight, read-only database explorer"
license = "MIT"
publish = false

[dependencies]
askama = "0.16.1"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
# Pin the engine driver while the adapter contract is being established.
# No SQL migrations, macro compiler database access, or extra engines.
sqlx = { version = "=0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
url = "=2.5.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
