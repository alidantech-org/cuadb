[package]
name = "cuadb"
version = "0.1.0"
edition = "2024"
description = "A local-first database explorer and SQL workspace for PostgreSQL and SQLite, in one binary with a browser UI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/alidantech-org/cuadb"
homepage = "https://github.com/alidantech-org/cuadb"
documentation = "https://github.com/alidantech-org/cuadb/tree/main/docs"
keywords = ["database", "postgresql", "sqlite", "sql", "explorer"]
categories = ["command-line-utilities", "database", "web-programming::http-server"]
rust-version = "1.88"
build = "build.rs"
include = [
    "/src/**",
    "/templates/**",
    "/public/**",
    "/build.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/docs/**",
]

[dependencies]
askama = "0.16.1"
async-trait = "0.1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
# Pin the engine driver while the adapter contract is being established.
# No SQL migrations, macro compiler database access, or extra engines.
sqlx = { version = "=0.8.6", default-features = false, features = ["mysql", "postgres", "sqlite", "runtime-tokio", "tls-rustls-ring-webpki"] }
url = "=2.5.8"
getrandom = "0.3"
zip = { version = "=2.6.1", default-features = false }
argon2 = "0.5"
sha2 = "0.10"
# Already in the tree through rustls; used directly for AES-256-GCM sealing of saved secrets.
ring = "0.17"
sqlparser = { version = "0.59", features = ["visitor"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Password hashing is deliberately expensive; keep debug builds and tests usable.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
