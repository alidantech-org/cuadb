[package]
name = "cuadb"
version = "0.1.0"
edition = "2024"
description = "A lightweight, read-only database explorer"
license = "MIT"
publish = false

[dependencies]
askama = "0.16.1"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
