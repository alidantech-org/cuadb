/* record editor */
function fctl(c,v,isN){const nm=c.n,ro=!isN&&c.pk,isNull=v===null,e0=v===null||v===undefined;let t;
 if(ENUMS[nm]&&c.t==='text')t=`<select class="inp" name="${nm}">${ENUMS[nm].map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
 else if(c.t==='boolean')t=`<input type="checkbox" class="tg" name="${nm}" ${v?'checked':''}>`;
 else if(c.t==='jsonb')t=`<textarea class="inp" name="${nm}" rows="4" data-json>${esc(e0?'{}':JSON.stringify(v,null,2))}</textarea>`;
 else if(c.t==='timestamptz')t=`<input class="inp" type="datetime-local" name="${nm}" value="${v?v.slice(0,16):''}">`;
 else if(numT(c.t))t=`<input class="inp" type="number" step="${c.t==='numeric'?'any':'1'}" name="${nm}" value="${e0?'':v}" ${isN&&c.pk&&c.t==='bigint'?'placeholder="auto"':''} ${ro?'readonly':''}>`;
 else t=`<input class="inp" name="${nm}" value="${e0?'':esc(Array.isArray(v)?v.join(', '):v)}" ${ro?'readonly':''} ${c.t==='uuid'&&isN?'placeholder="generated if empty"':''}>`;
 if(isNull&&c.nl)t=t.replace(/^<(\w+)/,'<$1 disabled');
 return`<label class="fl"><span class="row2">${nm} <code>${c.t}</code>${c.nl?`<span class="nlt"><input type="checkbox" data-nl="${nm}" ${isNull?'checked':''}> NULL</span>`:''}</span>${t}</label>`}
function editor(d){const isN=editing==='new',r=isN?null:d.r[editing];
 return`<h3>${isN?'New row':'Edit row '+(editing+1)}<button data-x1 aria-label="Close">×</button></h3><div class="ed">${d.c.map((c,i)=>fctl(c,r?r[i]:(c.nl?null:undefined),isN)).join('')}</div><div class="ef"><span class="err" id="eerr"></span><button class="btn" data-act="ecancel">Cancel</button><button class="btn on" data-act="esave">${isN?'Insert row':'Save changes'}</button></div>`}
function saveRow(){const d=T(cur),isN=editing==='new',row=[],er=m=>{$('#eerr').textContent=m;return false};
 for(const c of d.c){const el=document.querySelector('#insp [name="'+c.n+'"]'),nc=document.querySelector('#insp [data-nl="'+c.n+'"]');let v;
  if(nc&&nc.checked){row.push(null);continue}
  if(c.t==='boolean')v=el.checked;
  else if(c.t==='jsonb'){try{v=JSON.parse(el.value)}catch(_){return er(c.n+': invalid JSON')}}
  else if(numT(c.t)){if(el.value===''){if(c.pk&&isN&&c.t==='bigint')v=Math.max(...d.r.map(r=>r[d.c.indexOf(c)]))+1;else return er(c.n+' is required')}else v=+el.value}
  else if(c.t==='timestamptz'){if(!el.value)return er(c.n+' is required');v=el.value+':00Z'}
  else if(c.t==='text[]')v=el.value.split(',').map(x=>x.trim()).filter(Boolean);
  else{v=el.value;if(!v&&c.t==='uuid'&&c.pk&&isN)v=uid();if(!v)return er(c.n+' is required')}
  row.push(v)}
 const pk=d.c.findIndex(c=>c.pk);
 if(isN){if(d.r.some(r=>r[pk]===row[pk]))return er('Duplicate primary key');d.r.unshift(row);selRow=0;audit('insert',cur+' #'+row[pk])}
 else{d.r[editing]=row;selRow=editing;audit('update',cur+' #'+row[pk])}
 editing=null;toast(isN?'Row inserted':'Row updated');tree();main()}
/* SQL workspace */
function runSel(q){const m=q.match(/^select\s+(.+?)\s+from\s+([\w."]+)(?:\s+where\s+(\w+)\s*(=|>=|<=|!=|>|<)\s*('[^']*'|[\w.-]+))?(?:\s+order\s+by\s+(\w+)(?:\s+(asc|desc))?)?(?:\s+limit\s+(\d+))?$/is);
 if(!m)return{err:'Demo parser supports: SELECT cols FROM schema.table [WHERE col = value] [ORDER BY col [DESC]] [LIMIT n].'};
 let ref=m[2].replace(/"/g,'');if(!ref.includes('.'))ref='public.'+ref;let d;try{d=T(ref)}catch(_){}
 if(!d)return{err:'relation "'+m[2]+'" does not exist'};
 const names=m[1].trim()==='*'?d.c.map(c=>c.n):m[1].split(',').map(x=>x.trim()),cs=names.map(n=>d.c.find(c=>c.n===n));
 if(cs.includes(undefined))return{err:'column "'+names[cs.indexOf(undefined)]+'" does not exist'};
 let r=d.r.slice();
 if(m[3]){const i=d.c.findIndex(c=>c.n===m[3]);if(i<0)return{err:'column "'+m[3]+'" does not exist'};const raw=m[5].replace(/^'|'$/g,'');
  r=r.filter(x=>{const v=x[i];if(v===null)return false;const a=typeof v==='number'?v:String(v),b=typeof v==='number'?+raw:raw,c=a>b?1:a<b?-1:0;return{'=':c===0,'>':c>0,'<':c<0,'>=':c>=0,'<=':c<=0,'!=':c!==0}[m[4]]})}
 if(m[6]){const i=d.c.findIndex(c=>c.n===m[6]);if(i<0)return{err:'column "'+m[6]+'" does not exist'};const k=/desc/i.test(m[7]||'')?-1:1;r.sort((a,b)=>a[i]===null?1:b[i]===null?-1:(a[i]>b[i]?1:a[i]<b[i]?-1:0)*k)}
 const lim=Math.min(+m[8]||500,500);return{cs,rows:r.slice(0,lim).map(x=>cs.map(c=>x[d.c.indexOf(c)])),total:r.length,lim,ms:Math.round(4+Math.random()*14)}}
function runSql(){sqlText=$('#sql').value;const q=sqlText.trim().replace(/;+\s*$/,''),kw=(q.match(/^\w+/)||[''])[0].toLowerCase();
 const need=['select','explain','show'].includes(kw)?1:['insert','update'].includes(kw)?2:['delete','drop','truncate','alter'].includes(kw)?3:9;
 if(/;\s*\S/.test(q))sqlRes={err:'Only one statement can run at a time.'};
 else if(need===9)sqlRes={err:'Unsupported statement. Allowed: SELECT, INSERT, UPDATE, DELETE and DDL, depending on your access.'};
 else if(RK[acc()]<need)sqlRes={err:'Permission denied: '+kw.toUpperCase()+' needs '+['','read-only','write','destructive'][need]+' access to '+adb+'. You have '+ML[acc()].toLowerCase()+' access.'};
 else if(need===1)sqlRes=kw==='select'?runSel(q):{msg:'Statement accepted (simulated).'};
 else{sqlRes={msg:kw.toUpperCase()+' accepted (simulated, no data was changed in this demo).'};audit('sql',q.slice(0,60))}
 $('#sqlout').innerHTML=sqlOut()}
function sqlOut(){const r=sqlRes;if(!r)return'<div class="sqle" style="color:var(--mu)">Run a query to see results. Ctrl or ⌘ + Enter also runs it.</div>';
 if(r.err)return`<div class="sqle err2">${esc(r.err)}</div>`;if(r.msg)return`<div class="sqle">${esc(r.msg)}</div>`;
 return`<table><thead><tr>${r.cs.map(c=>`<th class="${numT(c.t)?'num':''}">${c.n}<small>${c.t}</small></th>`).join('')}</tr></thead><tbody>${r.rows.map(x=>`<tr>${x.map((v,i)=>`<td class="${numT(r.cs[i].t)?'num':''}">${cell(r.cs[i],v)}</td>`).join('')}</tr>`).join('')}</tbody></table><div class="sqle" style="color:var(--mu)">${r.rows.length} rows${r.total>r.lim?' (limited to '+r.lim+' of '+r.total+')':''} · ${r.ms} ms</div>`}
function sqlView(){$('#mainbody').innerHTML=`<div class="bar"><h1>${ic('fn')}<span>SQL</span>workspace</h1><span class="meta">${esc(CONNS[conn].name)} · ${adb}</span><span class="tag m-${acc()}">${ML[acc()]}</span><span class="sp"></span><button class="btn on" id="sqlrun">Run ⌘↵</button></div><div class="sqlw"><textarea id="sql" spellcheck="false">${esc(sqlText)}</textarea><div class="sqlh">Max 500 rows · 10 s timeout · ${RK[acc()]>=3?'destructive statements allowed':RK[acc()]>=2?'writes allowed, destructive statements blocked':'read-only: SELECT only'}</div><div id="sqlout">${sqlOut()}</div></div>`}
/* export */
const cq=v=>{if(v===null||v===undefined)return'';const t=typeof v==='object'?(Array.isArray(v)?'{'+v.join(',')+'}':JSON.stringify(v)):String(v);return/[",\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};
const csvOf=(d,rs,cs)=>[cs.map(c=>c.n).join(','),...rs.map(r=>cs.map(c=>cq(r[d.c.indexOf(c)])).join(','))].join('\n');
function dl(n,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)}
const crcT=new Uint32Array(256).map((_,n)=>{for(let k=0;k<8;k++)n=n&1?0xEDB88320^n>>>1:n>>>1;return n>>>0});
const crc=b=>{let c=-1;for(const x of b)c=crcT[(c^x)&255]^c>>>8;return(c^-1)>>>0};
function zip(files){const e=new TextEncoder(),ch=[],cd=[];let off=0;
 for(const[n,t]of files){const nm=e.encode(n),d=e.encode(t),c=crc(d),h=new DataView(new ArrayBuffer(30));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);ch.push(h.buffer,nm,d);
  const g=new DataView(new ArrayBuffer(46));g.setUint32(0,0x02014b50,true);g.setUint16(4,20,true);g.setUint16(6,20,true);g.setUint32(16,c,true);g.setUint32(20,d.length,true);g.setUint32(24,d.length,true);g.setUint16(28,nm.length,true);g.setUint32(42,off,true);cd.push(g.buffer,nm);off+=30+nm.length+d.length}
 const z=new DataView(new ArrayBuffer(22));z.setUint32(0,0x06054b50,true);z.setUint16(8,files.length,true);z.setUint16(10,files.length,true);z.setUint32(12,cd.reduce((a,b)=>a+b.byteLength,0),true);z.setUint32(16,off,true);
 return new Blob([...ch,...cd,z.buffer],{type:'application/zip'})}
function ex(m){const d=T(cur),vis=d.c.filter(c=>!hid[cur].has(c.n)),n=cur.replace('.','_'),v=()=>csvOf(d,rows().map(o=>o.x),vis);
 if(m==='copy'){navigator.clipboard&&navigator.clipboard.writeText(v());toast('Copied '+rows().length+' rows as CSV')}
 else if(m==='csv-view')dl(n+'.csv',new Blob([v()],{type:'text/csv'}));
 else if(m==='csv-all')dl(n+'.csv',new Blob([csvOf(d,d.r,d.c)],{type:'text/csv'}));
 else if(m==='json-all')dl(n+'.json',new Blob([JSON.stringify(d.r.map(r=>Object.fromEntries(d.c.map((c,i)=>[c.n,r[i]]))),null,2)],{type:'application/json'}));
 else if(m==='linked'){selMode=true;sel=new Set([cur]);incl=true;$('#side').classList.add('show');tree();selbar()}
 $('#exppop').classList.remove('show')}

 e.innerHTML=`<div class="sr"><b>${sel.size} selected</b><span style="display:flex;gap:6px"><button class="btn" id="sx">Done</button><button class="btn on" id="sz" ${sel.size?'':'disabled'}>Export ZIP</button></span></div><div class="sr"><span>Include linked tables ${l.size?`<small style="color:var(--mu)">+${l.size}</small>`:''}</span><input type="checkbox" class="tg" id="incl" ${incl?'checked':''}></div>`}

 else if(b.id==='sz'){const all=new Set(sel);if(incl)links(sel).forEach(k=>all.add(k));const rel=['table,column,references'];
  const files=[...all].map(k=>{const d=T(k);Object.entries(d.fk||{}).forEach(([c,r])=>rel.push([k,c,r].join(',')));return[k.replace('.','_')+'.csv',csvOf(d,d.r,d.c)]});
  files.push(['relations.csv',rel.join('\n')]);dl('cuadb-'+adb+'-export.zip',zip(files));toast('Exported '+all.size+' tables as ZIP')}};
$('#selbar').onchange=e=>{if(e.target.id==='incl'){incl=e.target.checked;tree();selbar()}};

function bar(l,v,t,k){return`<div class="br" ${k?`data-k="${k}"`:''}><span>${esc(l)}</span><i><u style="width:${Math.max(1,v/t*100)}%"></u></i><b>${fb(v)}</b></div>`}
function ov(){const ts=[];Object.keys(DB).forEach(s=>Object.keys(DB[s]).forEach(t=>ts.push({s,t,d:DB[s][t]})));const tb=ts.filter(x=>!x.d.v),tot=total(),cnt=k=>META.filter(m=>m.k===k).length,mx=Math.max(...tb.map(x=>x.d.b));
 return`<div class="bar"><h1>${ic('overview')}<span>db.</span>${adb}</h1><span class="meta">PostgreSQL 16.4 · UTF8 · ${fb(tot)} total</span></div><div class="gw st"><div class="cards">${[['Total size',fb(tot)],['Tables',tb.length],['Views',ts.length-tb.length],['Functions',cnt('function')],['Procedures',cnt('procedure')],['Sequences',cnt('sequence')],['Types',cnt('type')],['Triggers',cnt('trigger')],['Extensions',EXT.length]].map(c=>`<div class="card"><small>${c[0]}</small><b>${c[1]}</b></div>`).join('')}</div><h4>Size by schema</h4>${[...Object.keys(DB).map(s=>[s,Object.values(DB[s]).reduce((a,d)=>a+(d.b||0),0)]),['pg_catalog (system)',SYS]].map(z=>bar(z[0],z[1],tot)).join('')}<h4>Largest tables</h4>${tb.sort((a,b)=>b.d.b-a.d.b).slice(0,6).map(x=>bar(x.s+'.'+x.t,x.d.b,mx,x.s+'.'+x.t)).join('')}<h4>Extensions</h4><table><tbody>${EXT.map(e=>`<tr><td><b>${e[0]}</b></td><td>${e[1]}</td><td style="color:var(--mu)">${e[2]}</td></tr>`).join('')}</tbody></table></div>`}

['Explorer',[['mode','Mode','seg',[['explore','Simple'],['advanced','Advanced']]]]],
