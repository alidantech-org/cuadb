<!doctype html>
<html lang="en">

<style>
:root{--bg:#f4f5f3;--sf:#fbfbfa;--sf2:#eef0ed;--bd:#e0e3df;--tx:#1c2322;--mu:#76807c;--ac:#0e7c86;--acs:#dff1f2;--ok:#2f8f5b;--wr:#b7791f;--sw:264px;--rh:26px;--sh:0 8px 28px rgba(20,30,28,.16);color-scheme:light}

*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:12.5px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;border-radius:6px;padding:0}

code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
.btn{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border:1px solid var(--bd);background:var(--sf);border-radius:6px}

.sp{flex:1}
.conn{position:relative}
.cbtn{height:28px;padding:0 9px;border:1px solid var(--bd);border-radius:7px;display:flex;align-items:center;gap:7px;background:var(--bg)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.pop{position:absolute;z-index:30;background:var(--sf);border:1px solid var(--bd);border-radius:9px;box-shadow:var(--sh);padding:4px;display:none}

#cpop{top:33px;left:0;width:280px}
.ci{display:flex;gap:8px;align-items:center;width:100%;text-align:left;padding:6px 8px}

.tag{font-size:10px;padding:0 5px;border-radius:4px;background:var(--sf2);color:var(--mu);border:1px solid var(--bd)}
.ro{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:transparent}
.app{flex:1;display:flex;min-height:0}
aside{width:var(--sw);flex:none;display:flex;flex-direction:column;background:var(--sf);min-width:0}

.sh{display:flex;align-items:center;gap:5px;width:100%;padding:4px 6px;color:var(--mu);font-weight:600;text-align:left}

.ch{width:0;height:0;border:4px solid transparent;border-left-color:currentColor;transition:transform .12s;flex:none}
.o>.row .ch,.o>.sh .ch{transform:rotate(90deg)}
.row{display:flex;align-items:center;gap:5px;padding:0 4px 0 14px;height:24px;border-radius:5px;cursor:pointer}

.col{display:flex;gap:6px;padding:1px 6px;color:var(--mu);font-size:11.5px}
.col b{color:var(--tx);font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis}
.sub{display:none}.o>.sub{display:block}
#rs{width:5px;margin:0 -2px;cursor:col-resize;z-index:5;background:linear-gradient(var(--bd),var(--bd)) center/1px 100% no-repeat}

main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--bd);overflow:auto;flex:none;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:7px 7px 0 0;color:var(--mu);white-space:nowrap}

.seg{display:inline-flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden;background:var(--sf)}

.tb{display:flex;gap:6px;align-items:center;padding:4px 10px 8px;position:relative}

.pq{display:flex;gap:4px;padding:3px 4px 5px;border-bottom:1px solid var(--bd);margin-bottom:3px}

.gw{flex:1;overflow:auto;background:var(--sf);min-width:0}
table{border-collapse:separate;border-spacing:0;min-width:100%}
th{position:sticky;top:0;z-index:2;background:var(--sf2);text-align:left;font-weight:600;height:var(--rh);padding:0 10px;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);white-space:nowrap;cursor:pointer;user-select:none}

th .s{color:var(--ac);margin-left:4px}
td{height:var(--rh);padding:0 10px;border-bottom:1px solid var(--bd);border-right:1px solid color-mix(in srgb,var(--bd) 50%,transparent);white-space:nowrap;max-width:300px;overflow:hidden;text-overflow:ellipsis}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.rn,th.rn{position:sticky;left:0;color:var(--mu);width:42px;text-align:right;background:var(--sf2);z-index:1;cursor:default}
tr:hover td{background:var(--acs)}tr.sel td{background:var(--acs);box-shadow:inset 0 1px var(--ac),inset 0 -1px var(--ac)}
.dn td{--rh:20px}
.nul{color:var(--mu);opacity:.55;font-size:10.5px}

.js{color:var(--mu)}.ts{color:var(--mu)}
.pk{color:var(--wr);font-size:10px}
#insp{width:310px;flex:none;border-left:1px solid var(--bd);background:var(--sf);overflow:auto;display:none}
#insp.show{display:block}
#insp h3{margin:0;padding:9px 12px;font-size:12px;display:flex;justify-content:space-between;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--sf)}
.kv{padding:6px 12px;border-bottom:1px solid color-mix(in srgb,var(--bd) 60%,transparent)}
.kv label{color:var(--mu);font-size:11px;display:flex;justify-content:space-between}

.foot{display:flex;align-items:center;gap:8px;padding:5px 10px;border-top:1px solid var(--bd);background:var(--sf);color:var(--mu);flex:none}
.foot select{background:var(--bg);border:1px solid var(--bd);border-radius:5px;height:22px}
.st{padding:14px}.st table{width:auto;min-width:560px;border:1px solid var(--bd);border-radius:8px}
.st th{cursor:default}.st h4{margin:14px 0 6px;font-size:12px}

#toast.show{opacity:1}
@media(max-width:760px){#insp{position:absolute;right:0;top:40px;bottom:0;box-shadow:var(--sh)}aside{position:absolute;z-index:20;top:40px;bottom:0;transform:translateX(-100%)}aside.show{transform:none}.hm{display:inline-flex!important}}
.hm{display:none}

.sfoot{position:relative;display:flex;gap:6px;padding:8px;border-top:1px solid var(--bd)}
.sfoot .cbtn{flex:1;min-width:0;height:34px;text-align:left}
.sfoot .ico{width:34px;height:34px}
.cn{display:flex;flex-direction:column;line-height:1.2;flex:1;min-width:0}
.cn b,.cn small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cn small{color:var(--mu);font-size:10.5px}
#cpop,#spop{top:auto;bottom:50px;left:8px}#cpop{width:250px}#spop{width:292px;padding:6px 10px 10px}
.sg{font-weight:600;color:var(--mu);font-size:11px;padding:8px 0 2px}
.sr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 0;min-height:28px}
.tg{appearance:none;-webkit-appearance:none;width:26px;height:15px;border-radius:9px;background:var(--bd);position:relative;cursor:pointer;margin:0;flex:none}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--sf);transition:transform .15s}
.tg:checked{background:var(--ac)}.tg:checked::after{transform:translateX(11px)}
.sw2{width:16px;height:16px;border-radius:50%;border:2px solid transparent;outline:1px solid var(--bd)}.sw2.on{border-color:var(--sf);outline:2px solid var(--tx)}
:root,:root[data-theme=dark]{--acs:color-mix(in srgb,var(--ac) 16%,var(--sf))}
.bar{display:flex;align-items:center;gap:6px;padding:8px 10px;flex-wrap:wrap;position:relative}
.bar h1{font-size:14px;margin:0 4px 0 0;font-weight:650}.bar h1 span{color:var(--mu);font-weight:400}
.bar .meta{margin-right:6px}.bar .inp{width:210px;flex:none}
#colpop{top:44px;right:auto;left:auto}
.zb tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--sf2) 55%,transparent)}
.zb tbody tr:hover td,.zb tbody tr.sel td{background:var(--acs)}
.nrn .rn{display:none}.nty th small{display:none}
@media(max-width:760px){aside{top:0}#insp{top:0}}
.gw,#tree,#insp{--sb:transparent}
.gw:hover,#tree:hover,#insp:hover{--sb:color-mix(in srgb,var(--mu) 40%,transparent)}
.gw::-webkit-scrollbar,#tree::-webkit-scrollbar,#insp::-webkit-scrollbar{width:6px;height:6px}
.gw::-webkit-scrollbar-track,#tree::-webkit-scrollbar-track,#insp::-webkit-scrollbar-track,.gw::-webkit-scrollbar-corner{background:transparent}
.gw::-webkit-scrollbar-thumb,#tree::-webkit-scrollbar-thumb,#insp::-webkit-scrollbar-thumb{background:var(--sb);border-radius:6px;transition:background .2s}
.gw::-webkit-scrollbar-thumb:hover{background:var(--mu)}
@supports (-moz-appearance:none){.gw,#tree,#insp{scrollbar-width:thin;scrollbar-color:var(--sb) transparent}}

:root{--nh:150;--ns:6%;--bg:hsl(var(--nh) var(--ns) 96%);--sf:hsl(var(--nh) var(--ns) 99%);--sf2:hsl(var(--nh) var(--ns) 93.5%);--bd:hsl(var(--nh) var(--ns) 88%);--tx:hsl(var(--nh) 14% 12%);--mu:hsl(var(--nh) 6% 45%);--rad:6px;--ff:system-ui,-apple-system,"Segoe UI",sans-serif}
:root[data-theme=dark]{--bg:hsl(var(--nh) var(--ns) 7.5%);--sf:hsl(var(--nh) var(--ns) 10.5%);--sf2:hsl(var(--nh) var(--ns) 14%);--bd:hsl(var(--nh) var(--ns) 18%);--tx:hsl(var(--nh) 10% 90%);--mu:hsl(var(--nh) 6% 60%)}
:root[data-pal=slate]{--nh:220;--ns:16%}:root[data-pal=sand]{--nh:38;--ns:18%}:root[data-pal=mono]{--nh:0;--ns:0%}
body{font-family:var(--ff)}
.btn,.inp,.seg,.cbtn,.row,.pl,.ci,.card,.src{border-radius:var(--rad)}.pop{border-radius:calc(var(--rad) + 3px)}
.ic{flex:none;color:hsl(var(--h) 50% 40%)}:root[data-theme=dark] .ic{color:hsl(var(--h) 55% 68%)}.icm .ic{color:var(--mu)!important}
.row{padding-left:6px;gap:6px}.row.ov{font-weight:600}.row.lk{box-shadow:inset 2px 0 var(--ac)}.row .c:empty{display:none}
.cv{width:12px;height:100%;display:flex;align-items:center;justify-content:center;flex:none}
.sh .tag{margin-left:auto}.sh.g{padding-left:20px;font-weight:500}
.sub .sub .row{padding-left:24px}.sub .sub .cols{margin-left:42px}
.ck{margin:0;accent-color:var(--ac);width:14px;height:14px;flex:none}
.sf .ico{width:26px;flex:none}
#selbar{display:none;border-top:1px solid var(--bd);padding:6px 10px;background:var(--sf2)}
#spop{max-height:72vh;overflow:auto}
.cc{width:22px;height:20px;padding:0;border:0;background:none}
.bar h1{display:flex;align-items:center;gap:6px}
#colpop,#exppop{top:44px;right:10px;left:auto}#exppop{width:270px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.card{border:1px solid var(--bd);padding:8px 10px;background:var(--bg)}.card small{display:block;color:var(--mu)}.card b{font-size:18px;font-variant-numeric:tabular-nums}
.br{display:flex;align-items:center;gap:10px;padding:3px 0;max-width:600px}.br[data-k]{cursor:pointer}.br[data-k]:hover span{color:var(--ac)}

.src{background:var(--bg);border:1px solid var(--bd);padding:10px;overflow:auto;font:11.5px/1.5 ui-monospace,monospace;max-width:720px;margin:0}
a.fk{color:var(--ac);text-decoration:underline dotted;cursor:pointer}
.l-rows td,.l-rows th{border-right-color:transparent}.l-none td,.l-none th{border-color:transparent}.l-all td{border-right-color:var(--bd)}

.exm #seg,.exm [data-ex=linked]{display:none}
.foot,.sfoot{height:38px;padding:0 10px;align-items:center;flex:none}
.sfoot{gap:6px}

#cpop,#spop{bottom:44px}
</style>
</head>

 b.innerHTML=`<div class="bar"><h1>${ic(iconFor({n:t,d}))}<span>${s}.</span>${esc(t)}</h1>${d.v?'<span class="tag">view</span>':''}<span class="meta">${d.r.length} rows · ${d.v?'view':fb(d.b)}</span><span class="sp"></span>${view==='data'?`<input class="inp" id="q" placeholder="Search rows…" value="${esc(q)}"><button class="btn ${h.size?'on':''}" id="colb">Columns${h.size?` · ${h.size} hidden`:''}</button><button class="btn ${['compact','dense'].includes(S.dens)?'on':''}" id="dn">Compact</button><button class="btn" id="expb">Export ▾</button>`:''}<div class="seg" id="seg">${[['data','Data'],['cols','Structure'],['idx','Indexes']].map(v=>`<button data-v="${v[0]}" class="${view===v[0]?'on':''}">${v[1]}</button>`).join('')}</div>${view==='data'?`<div class="pop" id="exppop"><button class="ci" data-ex="csv-view"><span><b>Download CSV</b><small>${rows().length} rows in this view, visible columns</small></span></button><button class="ci" data-ex="csv-all"><span><b>Download CSV: whole table</b><small>${d.r.length} rows, all columns</small></span></button><button class="ci" data-ex="json-all"><span><b>Download JSON: whole table</b><small>${d.r.length} rows</small></span></button><button class="ci" data-ex="copy"><span><b>Copy as CSV</b><small>This view, to clipboard</small></span></button><button class="ci" data-ex="linked"><span><b>Export with linked tables…</b><small>Pick tables, download a ZIP</small></span></button></div><div class="pop" id="colpop"><div class="pq"><button class="btn" data-q="all">Show all</button><button class="btn" data-q="none">Hide all</button></div>${d.c.map(c=>`<label class="pl"><input type="checkbox" data-h="${c.n}" ${h.has(c.n)?'':'checked'}>${c.n}<small>${c.t}</small></label>`).join('')}</div>`:''}</div>${body}`}
function insp(d){if(selRow===null)return'';const r=d.r[selRow];return`<h3>Row ${selRow+1}<button data-x1 aria-label="Close">×</button></h3>`+d.c.map((c,i)=>`<div class="kv"><label>${c.n}<span>${c.t}</span></label><pre>${r[i]===null?'NULL':esc(typeof r[i]==='object'?JSON.stringify(r[i],null,2):r[i])}</pre></div>`).join('')}
/* main delegation */
document.addEventListener('click',e=>{const g=s=>e.target.closest(s);
 if(!g('.pop')&&!g('#colb')&&!g('#cbtn')&&!g('#sbtn')&&!g('#expb')){$('#cpop').classList.remove('show');$('#spop').classList.remove('show');document.querySelectorAll('#colpop,#exppop').forEach(p=>p.classList.remove('show'))}
 let x;
 if(x=g('[data-v]')){view=x.dataset.v;main()}
 else if(x=g('[data-sc]')){const c=x.dataset.sc;sort=!sort||sort.c!==c?{c,d:1}:sort.d===1?{c,d:-1}:null;tsave();main()}
 else if(g('[data-x1]')){selRow=null;main()}
 else if(x=g('tr[data-r]')){selRow=+x.dataset.r;main()}
 else if(g('#colb')){$('#colpop').classList.toggle('show')}
 else if(x=g('[data-q]')){const h=hid[cur];h.clear();if(x.dataset.q==='none')T(cur).c.slice(1).forEach(c=>h.add(c.n));tsave();main();$('#colpop').classList.add('show')}
 else if(g('#dn')){S.dens=S.dens==='compact'?'comfortable':'compact';sv();main()}else if(g('#pv')){page--;main()}else if(g('#nx')){page++;main()}
 else if(g('#expb')){$('#exppop').classList.toggle('show')}
 else if(x=g('[data-ex]')){ex(x.dataset.ex)}
 else if(x=g('[data-fk]')){openTab(x.dataset.fk);q=x.dataset.v;main()}
 else if(x=g('.br[data-k]')){openTab(x.dataset.k)}});
document.addEventListener('change',e=>{if(e.target.dataset.h){const h=hid[cur];e.target.checked?h.delete(e.target.dataset.h):h.add(e.target.dataset.h);tsave();const sc=$('.gw').scrollLeft;main();$('#colpop').classList.add('show');$('.gw').scrollLeft=sc}else if(e.target.id==='ps'){PS=+e.target.value;page=0;main()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;page=0;const p=e.target.selectionStart;main();const i=$('#q');i.focus();i.setSelectionRange(p,p)}});
/* connection switcher */
function cpop(){$('#cpop').innerHTML=CONNS.map((c,i)=>`<button class="ci" data-cn="${i}" role="option"><span><b>${c[0]}</b><small>${c[1]} · ${c[2]}</small></span>${i===conn?'<span style="margin-left:auto;color:var(--ac)">✓</span>':''}</button>`).join('')+'<div style="border-top:1px solid var(--bd);margin:3px 0"></div><button class="ci" disabled style="color:var(--mu)">＋ New connection <span class="tag" style="margin-left:auto">soon</span></button>'}
$('#cbtn').onclick=()=>{$('#spop').classList.remove('show');cpop();$('#cpop').classList.toggle('show')};
$('#cpop').onclick=e=>{const b=e.target.closest('[data-cn]');if(!b)return;conn=+b.dataset.cn;$('#cname').textContent=CONNS[conn][0];$('#cpop').classList.remove('show');toast('Switched to '+CONNS[conn][0]+' (demo data)')};
/* export */
const cq=v=>{if(v===null||v===undefined)return'';const t=typeof v==='object'?(Array.isArray(v)?'{'+v.join(',')+'}':JSON.stringify(v)):String(v);return/[",\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};
const csvOf=(d,rs,cs)=>[cs.map(c=>c.n).join(','),...rs.map(r=>cs.map(c=>cq(r[d.c.indexOf(c)])).join(','))].join('\n');
function dl(n,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)}
const crcT=new Uint32Array(256).map((_,n)=>{for(let k=0;k<8;k++)n=n&1?0xEDB88320^n>>>1:n>>>1;return n>>>0});
const crc=b=>{let c=-1;for(const x of b)c=crcT[(c^x)&255]^c>>>8;return(c^-1)>>>0};
function zip(files){const e=new TextEncoder(),ch=[],cd=[];let off=0;
 for(const[n,t]of files){const nm=e.encode(n),d=e.encode(t),c=crc(d),h=new DataView(new ArrayBuffer(30));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);ch.push(h.buffer,nm,d);
  const g=new DataView(new ArrayBuffer(46));g.setUint32(0,0x02014b50,true);g.setUint16(4,20,true);g.setUint16(6,20,true);g.setUint32(16,c,true);g.setUint32(20,d.length,true);g.setUint32(24,d.length,true);g.setUint16(28,nm.length,true);g.setUint32(42,off,true);cd.push(g.buffer,nm);off+=30+nm.length+d.length}
 const z=new DataView(new ArrayBuffer(22));z.setUint32(0,0x06054b50,true);z.setUint16(8,files.length,true);z.setUint16(10,files.length,true);z.setUint32(12,cd.reduce((a,b)=>a+b.byteLength,0),true);z.setUint32(16,off,true);
 return new Blob([...ch,...cd,z.buffer],{type:'application/zip'})}
function ex(m){const d=T(cur),vis=d.c.filter(c=>!hid[cur].has(c.n)),n=cur.replace('.','_'),v=()=>csvOf(d,rows().map(o=>o.x),vis);
 if(m==='copy'){navigator.clipboard&&navigator.clipboard.writeText(v());toast('Copied '+rows().length+' rows as CSV')}
 else if(m==='csv-view')dl(n+'.csv',new Blob([v()],{type:'text/csv'}));
 else if(m==='csv-all')dl(n+'.csv',new Blob([csvOf(d,d.r,d.c)],{type:'text/csv'}));
 else if(m==='json-all')dl(n+'.json',new Blob([JSON.stringify(d.r.map(r=>Object.fromEntries(d.c.map((c,i)=>[c.n,r[i]]))),null,2)],{type:'application/json'}));
 else if(m==='linked'){selMode=true;sel=new Set([cur]);incl=true;$('#side').classList.add('show');tree();selbar()}
 $('#exppop').classList.remove('show')}
function selbar(){const e=$('#selbar');e.style.display=selMode?'block':'none';if(!selMode)return;const l=links(sel);
 e.innerHTML=`<div class="sr"><b>${sel.size} selected</b><span style="display:flex;gap:6px"><button class="btn" id="sx">Done</button><button class="btn on" id="sz" ${sel.size?'':'disabled'}>Export ZIP</button></span></div><div class="sr"><span>Include linked tables ${l.size?`<small style="color:var(--mu)">+${l.size}</small>`:''}</span><input type="checkbox" class="tg" id="incl" ${incl?'checked':''}></div>`}
$('#selb').onclick=()=>{selMode=!selMode;if(!selMode)sel.clear();tree();selbar()};
$('#selbar').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id==='sx'){selMode=false;sel.clear();tree();selbar()}
 else if(b.id==='sz'){const all=new Set(sel);if(incl)links(sel).forEach(k=>all.add(k));const rel=['table,column,references'];
  const files=[...all].map(k=>{const d=T(k);Object.entries(d.fk||{}).forEach(([c,r])=>rel.push([k,c,r].join(',')));return[k.replace('.','_')+'.csv',csvOf(d,d.r,d.c)]});
  files.push(['relations.csv',rel.join('\n')]);dl('cuadb-'+CONNS[conn][1]+'-export.zip',zip(files));toast('Exported '+all.size+' tables as ZIP')}};
$('#selbar').onchange=e=>{if(e.target.id==='incl'){incl=e.target.checked;tree();selbar()}};
document.addEventListener('dblclick',e=>{const c=e.target.closest('td:not(.rn)');if(c&&navigator.clipboard){navigator.clipboard.writeText(c.innerText);toast('Cell copied')}});
/* overview + object pages */
function bar(l,v,t,k){return`<div class="br" ${k?`data-k="${k}"`:''}><span>${esc(l)}</span><i><u style="width:${Math.max(1,v/t*100)}%"></u></i><b>${fb(v)}</b></div>`}
function ov(){const ts=[];Object.keys(DB).forEach(s=>Object.keys(DB[s]).forEach(t=>ts.push({s,t,d:DB[s][t]})));const tb=ts.filter(x=>!x.d.v),tot=total(),cnt=k=>META.filter(m=>m.k===k).length,mx=Math.max(...tb.map(x=>x.d.b));
 return`<div class="bar"><h1>${ic('overview')}<span>db.</span>${CONNS[conn][1]}</h1><span class="meta">PostgreSQL 16.4 · UTF8 · ${fb(tot)} total</span></div><div class="gw st"><div class="cards">${[['Total size',fb(tot)],['Tables',tb.length],['Views',ts.length-tb.length],['Functions',cnt('function')],['Procedures',cnt('procedure')],['Sequences',cnt('sequence')],['Types',cnt('type')],['Triggers',cnt('trigger')],['Extensions',EXT.length]].map(c=>`<div class="card"><small>${c[0]}</small><b>${c[1]}</b></div>`).join('')}</div><h4>Size by schema</h4>${[...Object.keys(DB).map(s=>[s,Object.values(DB[s]).reduce((a,d)=>a+(d.b||0),0)]),['pg_catalog (system)',SYS]].map(z=>bar(z[0],z[1],tot)).join('')}<h4>Largest tables</h4>${tb.sort((a,b)=>b.d.b-a.d.b).slice(0,6).map(x=>bar(x.s+'.'+x.t,x.d.b,mx,x.s+'.'+x.t)).join('')}<h4>Extensions</h4><table><tbody>${EXT.map(e=>`<tr><td><b>${e[0]}</b></td><td>${e[1]}</td><td style="color:var(--mu)">${e[2]}</td></tr>`).join('')}</tbody></table></div>`}
function mv(){const[k,r]=cur.split(':'),m=META.find(x=>x.k===k&&x.s+'.'+x.n===r);
 return`<div class="bar"><h1>${ic(iconFor({m}))}<span>${m.s}.</span>${esc(m.n)}</h1><span class="tag">${m.k}</span></div><div class="gw st"><table><tbody>${Object.entries(m.p).map(a=>`<tr><td style="color:var(--mu)">${a[0]}</td><td>${esc(a[1])}</td></tr>`).join('')}</tbody></table>${m.src?`<h4>Definition</h4><pre class="src">${esc(m.src)}</pre>`:''}</div>`}
/* settings */
const SETS=[
['Explorer',[['mode','Mode','seg',[['explore','Simple'],['advanced','Advanced']]]]],
['Theme',[['theme','Mode','seg',[['system','Auto'],['light','Light'],['dark','Dark']]],['pal','Palette','seg',[['mist','Mist'],['slate','Slate'],['sand','Sand'],['mono','Mono']]],['accent','Accent','acc'],['rad','Corners','seg',[['2','Sharp'],['6','Soft'],['10','Round']]]]],
['Type',[['fs','Text size','seg',[['11.5','S'],['12.5','M'],['14','L']]],['ff','Font','seg',[['sans','Sans'],['serif','Serif'],['mono','Mono']]],['dmono','Monospace data cells','tg']]],
['Grid',[['dens','Row height','seg',[['dense','XS'],['compact','S'],['comfortable','M'],['roomy','L']]],['lines','Lines','seg',[['rows','Rows'],['all','Grid'],['none','None']]],['nulls','Empty value','seg',[['NULL','NULL'],['∅','∅'],['','Blank']]],['rn','Row numbers','tg'],['ty','Column types in header','tg'],['zb','Striped rows','tg'],['wrap','Wrap long text','tg'],['sep','Thousands separators','tg']]],
['Sidebar',[['icons','Icons','seg',[['color','Color'],['mono','Mono'],['off','Off']]],['side','Show','seg',[['rows','Rows'],['size','Size']]],['unit','Size units','seg',[['auto','Auto'],['KB','KB'],['MB','MB'],['GB','GB']]]]],
['Tables',[['remember','Remember hidden columns and sort','tg']]]];
function spop(){$('#spop').innerHTML=SETS.map(([h,rs])=>`<div class="sg">${h}</div>`+rs.map(([k,l,t,o])=>t==='tg'?`<div class="sr"><span>${l}</span><input type="checkbox" class="tg" data-tg="${k}" ${S[k]?'checked':''}></div>`:t==='seg'?`<div class="sr"><span>${l}</span><div class="seg">${o.map(x=>`<button data-st="${k}" data-val="${x[0]}" class="${String(S[k])===x[0]?'on':''}">${x[1]}</button>`).join('')}</div></div>`:`<div class="sr"><span>${l}</span><span style="display:flex;gap:5px;align-items:center">${['','#2f6fdb','#7b61d6','#2f8f5b','#c27a1a','#c2485a'].map(c=>`<button class="sw2 ${S.accent===c?'on':''}" data-ac="${c}" style="background:${c||'#0e7c86'}" aria-label="Accent ${c||'default'}"></button>`).join('')}<input type="color" class="cc" data-cc value="${S.accent||'#0e7c86'}" aria-label="Custom accent"></span></div>`).join('')).join('')+`<div class="sr" style="margin-top:8px"><button class="btn" id="rst" ${cur&&!cur.includes(':')&&cur!=='__overview'?'':'disabled'}>Reset this table</button><button class="btn" id="rall">Reset all</button></div>`}
$('#sbtn').onclick=()=>{$('#cpop').classList.remove('show');spop();$('#spop').classList.toggle('show')};
$('#spop').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.st)S[b.dataset.st]=b.dataset.val;else if(b.dataset.ac!==undefined)S.accent=b.dataset.ac;
 else if(b.id==='rst'){hid[cur]=new Set();sort=null;delete TP[cur]}else if(b.id==='rall'){Object.assign(S,DEF);Object.keys(TP).forEach(k=>delete TP[k])}else return;
 sv();apply();spop();tree();main()};
$('#spop').onchange=e=>{if(e.target.dataset.tg)S[e.target.dataset.tg]=e.target.checked;else if(e.target.dataset.cc!==undefined)S.accent=e.target.value;else return;sv();apply();spop();tree();main()};
/* misc */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800)}
$('#menu').onclick=()=>$('#side').classList.toggle('show');
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();$('#side').classList.add('show');$('#f').focus();$('#f').select()}
 if(e.key==='Escape'){$('#cpop').classList.remove('show');$('#spop').classList.remove('show');if(selRow!==null){selRow=null;main()}}});
apply();
tree();openTab('public.users');
</script>
