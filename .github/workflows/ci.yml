name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run assets:build
      - run: bun run check
      - run: bun run test
      - run: bun run smoke

  build-binaries:
    name: Build (${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run assets:build
      - run: cargo build --locked --release
      - name: Binary starts and reports its version
        shell: bash
        run: ./target/release/cuadb --version

  package:
    name: crates.io package
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run assets:build
      - run: cargo publish --dry-run --locked --allow-dirty

  docker:
    name: Docker image
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cuadb:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starts and is healthy
        run: |
          docker run -d --name cuadb -p 127.0.0.1:4848:4848 cuadb:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4848/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4848/health
          curl -fsS -o /dev/null http://127.0.0.1:4848/static/app.js
          docker exec cuadb /usr/local/bin/cuadb healthcheck
          docker rm -f cuadb
